<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CS2 Match Roster Overlay</title>
<link rel="stylesheet" href="shared.css" />
<style>
  html, body { width: 100%; height: 100%; }
  #wrap {
    position: fixed;
    inset: 0;
    transition: opacity 0.3s ease;
  }
  #matchbar {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--bg-panel);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 8px;
    padding: 8px 16px;
  }
  .team-elo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
  .flag { font-size: 20px; }
  .team-elo.enemy { flex-direction: row-reverse; }
  .vs { color: var(--text-dim); font-size: 12px; text-transform: uppercase; }
  #map { color: var(--accent); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
  .list {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 260px;
  }
  #mineList { left: 20px; }
  #enemyList { right: 20px; }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-panel);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .row-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #222; flex-shrink: 0; }
  .row-id { min-width: 0; flex: 1; }
  .row-name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-elo { font-size: 11px; color: var(--accent); font-weight: 600; }
  .row-stats { display: flex; gap: 8px; flex-shrink: 0; }
  .row-stat { display: flex; flex-direction: column; align-items: center; min-width: 30px; }
  .row-stat-value { font-size: 12px; font-weight: 700; }
  .row-stat-label { font-size: 8px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim); }
</style>
</head>
<body>
  <div id="wrap" class="hidden">
    <div id="matchbar">
      <div class="team-elo mine">
        <span class="flag" id="mineFlag"></span>
        <span id="mineElo">-</span>
      </div>
      <div>
        <div id="map">MAP</div>
        <div class="vs">VS</div>
      </div>
      <div class="team-elo enemy">
        <span class="flag" id="enemyFlag"></span>
        <span id="enemyElo">-</span>
      </div>
    </div>
    <div class="list" id="mineList"></div>
    <div class="list" id="enemyList"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const nickname = params.get('nickname');
  const pollMs = Number(params.get('refresh')) || 15_000;
  const wrapEl = document.getElementById('wrap');

  function countryFlag(code) {
    if (!code || code.length !== 2) return '';
    return String.fromCodePoint(...[...code.toUpperCase()].map((c) => 127397 + c.charCodeAt(0)));
  }

  function majorityCountry(entries) {
    const counts = {};
    for (const e of entries) {
      if (!e?.country) continue;
      counts[e.country] = (counts[e.country] || 0) + 1;
    }
    return Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || null;
  }

  function averageElo(entries) {
    const elos = entries.map((e) => e?.elo).filter((v) => typeof v === 'number');
    if (!elos.length) return null;
    return Math.round(elos.reduce((a, b) => a + b, 0) / elos.length);
  }

  function rowHtml(entry) {
    const s = entry.stats || {};
    return `
      <div class="row">
        <img class="row-avatar" src="${entry.avatar || ''}" alt="" />
        <div class="row-id">
          <div class="row-name">${entry.nickname}</div>
          <div class="row-elo">${entry.elo ?? '-'} ELO</div>
        </div>
        <div class="row-stats">
          <div class="row-stat">
            <div class="row-stat-value">${s.winRatePct != null ? s.winRatePct + '%' : '-'}</div>
            <div class="row-stat-label">Win</div>
          </div>
          <div class="row-stat">
            <div class="row-stat-value">${s.avgKills ?? '-'}</div>
            <div class="row-stat-label">Avg</div>
          </div>
          <div class="row-stat">
            <div class="row-stat-value">${s.headshotPct != null ? s.headshotPct + '%' : '-'}</div>
            <div class="row-stat-label">HS</div>
          </div>
        </div>
      </div>`;
  }

  function render(data) {
    if (!data || !data.live) {
      wrapEl.classList.add('hidden');
      return;
    }

    document.getElementById('map').textContent = (data.map || 'LIVE').replace(/^de_/, '');
    document.getElementById('mineElo').textContent = averageElo(data.mine) ?? '-';
    document.getElementById('enemyElo').textContent = averageElo(data.enemy) ?? '-';
    document.getElementById('mineFlag').textContent = countryFlag(majorityCountry(data.mine));
    document.getElementById('enemyFlag').textContent = countryFlag(majorityCountry(data.enemy));
    document.getElementById('mineList').innerHTML = data.mine.map(rowHtml).join('');
    document.getElementById('enemyList').innerHTML = data.enemy.map(rowHtml).join('');

    wrapEl.classList.remove('hidden');
  }

  async function poll() {
    if (!nickname) return;
    try {
      const res = await fetch(`/api/liveroster?nickname=${encodeURIComponent(nickname)}`);
      const data = await res.json();
      render(data);
    } catch {
      // Transient error - keep showing whatever was last rendered.
    }
  }

  poll();
  setInterval(poll, pollMs);
</script>
</body>
</html>
