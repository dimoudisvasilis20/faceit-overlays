<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CS2 Match Alerts</title>
<link rel="stylesheet" href="shared.css" />
<style>
  body { padding: 12px; }
</style>
</head>
<body>
  <div id="card" class="card toast">
    <div id="title" class="toast-title">MATCH STARTED</div>
    <div id="main" class="toast-main">-</div>
    <div id="sub" class="toast-sub"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const pollMs = Number(params.get('refresh')) || 3_000;
  const displayMs = Number(params.get('duration')) || 8_000;
  const el = (id) => document.getElementById(id);

  let wasPhase = null;
  let hideTimer = null;

  function showToast() {
    clearTimeout(hideTimer);
    el('card').classList.add('show');
    hideTimer = setTimeout(() => el('card').classList.remove('show'), displayMs);
  }

  function showMatchStart(state) {
    const opponents = (state.players || [])
      .filter((p) => p.team && p.team !== state.playerTeam && p.name)
      .map((p) => p.name);

    el('title').textContent = 'Match started';
    el('main').className = 'toast-main';
    el('main').textContent = (state.map || 'Map TBD').replace(/^de_/, '');
    el('sub').textContent = opponents.length ? 'vs ' + opponents.slice(0, 5).join(', ') : '';
    showToast();
  }

  function showMatchEnd(state) {
    const ct = state.ctScore ?? 0;
    const t = state.tScore ?? 0;
    const winnerSide = ct === t ? null : ct > t ? 'CT' : 'T';
    const won = winnerSide != null && state.playerTeam === winnerSide;

    el('title').textContent = 'Match ended';
    el('main').className = 'toast-main ' + (won ? 'win' : 'loss');
    el('main').textContent = (won ? 'VICTORY' : 'DEFEAT') + ' ' + ct + '-' + t;
    el('sub').textContent = '';
    showToast();
  }

  async function poll() {
    if (!token) return;
    try {
      const res = await fetch(`/api/gsi/${encodeURIComponent(token)}`);
      const state = await res.json();
      const phase = state.live ? state.phase : null;

      if (wasPhase === null) {
        wasPhase = phase;
        return;
      }

      if (wasPhase !== 'live' && phase === 'live') {
        showMatchStart(state);
      } else if (wasPhase === 'live' && phase === 'gameover') {
        showMatchEnd(state);
      }
      wasPhase = phase;
    } catch {
      // Transient error - keep last known state and try again next poll.
    }
  }

  poll();
  setInterval(poll, pollMs);
</script>
</body>
</html>
