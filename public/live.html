<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CS2 Live Match Overlay</title>
<link rel="stylesheet" href="shared.css" />
<style>
  body { padding: 12px; }
  .map-tag {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-dim);
  }
  .score-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 700;
  }
  .team-name {
    font-size: 13px;
    font-weight: 600;
  }
  .team-name.ct { color: #6fa8dc; }
  .team-name.t { color: #e8a33d; }
  .score {
    font-size: 22px;
    color: var(--accent);
  }
  .vs {
    color: var(--text-dim);
    font-size: 14px;
  }
  .bomb-tag {
    font-size: 11px;
    font-weight: 700;
    color: #f87171;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div id="card" class="card hidden">
    <div>
      <div class="map-tag" id="map">MAP</div>
      <div class="score-row">
        <span class="team-name ct" id="ctLabel">CT</span>
        <span class="score" id="ctScore">-</span>
        <span class="vs">:</span>
        <span class="score" id="tScore">-</span>
        <span class="team-name t" id="tLabel">T</span>
      </div>
      <div class="bomb-tag hidden" id="bombTag"></div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const refreshMs = Number(params.get('refresh')) || 3_000;
  const el = (id) => document.getElementById(id);

  async function refresh() {
    if (!token) {
      el('card').classList.add('hidden');
      return;
    }
    try {
      const res = await fetch(`/api/gsi/${encodeURIComponent(token)}`);
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();

      if (!data.live) {
        el('card').classList.add('hidden');
        return;
      }

      el('map').textContent = (data.map || 'LIVE').replace(/^de_/, '');
      el('ctScore').textContent = data.ctScore ?? '-';
      el('tScore').textContent = data.tScore ?? '-';

      const bombTag = el('bombTag');
      if (data.bomb === 'planted') {
        bombTag.textContent = 'Bomb planted';
        bombTag.classList.remove('hidden');
      } else {
        bombTag.classList.add('hidden');
      }

      el('card').classList.remove('hidden');
    } catch {
      el('card').classList.add('hidden');
    }
  }

  refresh();
  setInterval(refresh, refreshMs);
</script>
</body>
</html>
